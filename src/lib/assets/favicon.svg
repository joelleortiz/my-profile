<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
	<title>cat</title>
	<!-- ears -->
	<rect x="2" y="1" width="2" height="1" fill="#e8913a" />
	<rect x="12" y="1" width="2" height="1" fill="#e8913a" />
	<rect x="2" y="2" width="3" height="1" fill="#e8913a" />
	<rect x="11" y="2" width="3" height="1" fill="#e8913a" />
	<rect x="3" y="2" width="1" height="1" fill="#f6b8b8" />
	<rect x="12" y="2" width="1" height="1" fill="#f6b8b8" />
	<!-- head -->
	<rect x="2" y="3" width="12" height="1" fill="#e8913a" />
	<rect x="1" y="4" width="14" height="8" fill="#e8913a" />
	<rect x="2" y="12" width="12" height="1" fill="#e8913a" />
	<rect x="3" y="13" width="10" height="1" fill="#e8913a" />
	<!-- stripes -->
	<rect x="7" y="3" width="2" height="2" fill="#c96f22" />
	<rect x="1" y="7" width="2" height="1" fill="#c96f22" />
	<rect x="13" y="7" width="2" height="1" fill="#c96f22" />
	<!-- muzzle -->
	<rect x="5" y="9" width="6" height="3" fill="#fbe3c4" />
	<!-- eyes -->
	<rect x="4" y="6" width="2" height="2" fill="#222" />
	<rect x="10" y="6" width="2" height="2" fill="#222" />
	<rect x="4" y="6" width="1" height="1" fill="#fff" />
	<rect x="10" y="6" width="1" height="1" fill="#fff" />
	<!-- nose and mouth -->
	<rect x="7" y="9" width="2" height="1" fill="#e2687a" />
	<rect x="6" y="10" width="1" height="1" fill="#222" />
	<rect x="9" y="10" width="1" height="1" fill="#222" />
	<rect x="7" y="11" width="2" height="1" fill="#222" />
</svg>
